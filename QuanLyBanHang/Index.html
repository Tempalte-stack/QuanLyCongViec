<!DOCTYPE html>
<html lang="vi">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Shop Online</title>

        <link rel="stylesheet" href="Style.css">

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    </head>

    <body>

        <header>

            <div class="logo">
                <i class="fa-solid fa-store"></i>
                My Shop
            </div>

            <nav>

                <ul>

                    <li><a href="#">Trang Chủ</a></li>

                    <li class="dropdown">

                        <a href="#">
                            Sản Phẩm
                            <i class="fa fa-caret-down"></i>
                        </a>

                        <ul class="dropdown-menu">
                            <li><a href="#">Laptop</a></li>
                            <li><a href="#">Điện Thoại</a></li>
                            <li><a href="#">Phụ Kiện</a></li>
                        </ul>

                    </li>

                    <li><a href="#contact">Liên Hệ</a></li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-cart-shopping"></i>
                            (<span id="cart-count">0</span>)
                        </a>
                    </li>

                </ul>

            </nav>

        </header>

        <section class="banner">
            <h1>Website Bán Hàng</h1>
            <p>HTML CSS JavaScript</p>
        </section>

        <section class="products">

            <h2>Sản Phẩm Nổi Bật</h2>

            <div class="product-grid">

                <div class="card">

                    <img src="https://picsum.photos/300/200?1">

                    <h3>Laptop Gaming</h3>

                    <p>20.000.000đ</p>

                    <button onclick="addToCart('Laptop Gaming',20000000)">
                        Thêm vào giỏ
                    </button>

                </div>

                <div class="card">

                    <img src="https://picsum.photos/300/200?2">

                    <h3>iPhone</h3>

                    <p>18.000.000đ</p>

                    <button onclick="addToCart('iPhone',18000000)">
                        Thêm vào giỏ
                    </button>

                </div>

                <div class="card">

                    <img src="https://picsum.photos/300/200?3">

                    <h3>Tai Nghe</h3>

                    <p>500.000đ</p>

                    <button onclick="addToCart('Tai Nghe',500000)">
                        Thêm vào giỏ
                    </button>

                </div>

            </div>

        </section>

        <section class="cart">

            <h2>Giỏ Hàng</h2>

            <ul id="cart-items"></ul>

        </section>

        <section id="contact">

            <h2>Liên Hệ</h2>

            <form id="contactForm">

                <input type="text"
                    id="name"
                    placeholder="Họ tên">

                <input type="email"
                    id="email"
                    placeholder="Email">

                <textarea
                    id="message"
                    placeholder="Nội dung">
</textarea>

                <button type="submit">
                    Gửi
                </button>

            </form>

        </section>

        <script src="js/script.js"></script>

    </body>
</html>
